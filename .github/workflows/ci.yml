name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Test desktop companion
        run: |
          python3 -m unittest discover -s desktop/tests -v
          bash -n install.sh desktop/install.sh phone/install-via-adb.sh scripts/package-desktop.sh
          shellcheck install.sh desktop/install.sh phone/install-via-adb.sh scripts/package-desktop.sh
          ./scripts/package-desktop.sh

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Test and build Android app
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon
