name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6

      - name: Check release version
        run: test "${GITHUB_REF_NAME}" = "v$(cat VERSION)"

      - name: Restore Android signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "${KEYSTORE_BASE64}"
          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/codex-alert-release.jks"

      - name: Test and build signed APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/codex-alert-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest lintDebug assembleRelease --no-daemon

      - name: Package release assets
        run: |
          mkdir -p dist
          install -m 644 app/build/outputs/apk/release/app-release.apk dist/codex-alert.apk
          ./scripts/package-desktop.sh dist
          cd dist
          sha256sum codex-alert.apk codex-alert-desktop.tar.gz > SHA256SUMS

      - name: Attest release artifacts
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/codex-alert.apk
            dist/codex-alert-desktop.tar.gz

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes --verify-tag
